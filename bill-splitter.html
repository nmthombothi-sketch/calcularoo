*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {

  --smoke:    #f1f5f9;

  border-radius: 50%;

  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  transition: transform 0.15s;
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); }
input[type="range"]::-moz-range-thumb {
  width: 22px; height: 22px;
  background: var(--white);
  border: 3px solid var(--amber);
  border-radius: 50%;

}

}

  content: '';

  top: -50%; right: -50%;
  width: 200%; height: 200%;

}

.big-result {

<script>
let currencySymbol = '$';

function setCurrency(sym) {
  currencySymbol = sym;
  document.querySelectorAll('.prefix[data-type="currency"]').forEach(el => { el.textContent = sym; });
  calcSplit(); // Recalculate with new symbol
}

let fmtD = n => currencySymbol + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const v = id => { const e = document.getElementById(id); return e ? parseFloat(e.value) || 0 : 0; };
const el = id => document.getElementById(id) || { textContent: "" };

function syncR(inputId, range) { 
  document.getElementById(inputId).value = range.value; 
}

// BILL SPLITTER LOGIC
function calcSplit() {
  const bill = v('bs-bill');
  const people = Math.max(1, v('bs-people'));
  const tipPct = v('bs-tip') / 100;
  
  const tipAmt = bill * tipPct;
  const total = bill + tipAmt;
  
  const each = total / people;
  const billPP = bill / people;
  const tipPP = tipAmt / people;

  // Update DOM with animation pulse
  const eachEl = el('bs-each');
  eachEl.textContent = fmtD(each);
  eachEl.classList.remove('pulse');
  void eachEl.offsetWidth; // trigger reflow
  eachEl.classList.add('pulse');

  el('bs-billpp').textContent = fmtD(billPP);
  el('bs-tipp').textContent = fmtD(tipPP);
  el('bs-total').textContent = fmtD(total);
}

// Add pulse animation dynamically
const style = document.createElement('style');
style.textContent = `
  @keyframes pulse { 
    0% { transform: scale(1); } 
    50% { transform: scale(1.05); color: #fff; } 
    100% { transform: scale(1); } 
  }
  .pulse { animation: pulse 0.3s ease-out; }
`;
document.head.appendChild(style);

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  calcSplit();
  
  // Sync number input to range if user types manually
  document.getElementById('bs-people').addEventListener('input', function() {
    const range = document.querySelector('input[type="range"][oninput*="bs-people"]');
    if(range) range.value = this.value;
  });
  document.getElementById('bs-tip').addEventListener('input', function() {
    const range = document.querySelector('input[type="range"][oninput*="bs-tip"]');
    if(range) range.value = this.value;
  });
});
</script>
